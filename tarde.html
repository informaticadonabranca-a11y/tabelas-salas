<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turno Tarde</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    .topo {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 20px; padding: 10px 20px;
        background: #3949ab; color: white; border-radius: 8px;
        flex-wrap: wrap; gap: 10px;
    }
    .topo h1 { margin: 0; font-size: 22px; }
    .topo .acoes { display: flex; gap: 10px; align-items: center; }
    .topo a, .topo button {
        color: white; text-decoration: none; font-weight: bold;
        background: rgba(255,255,255,0.2);
        padding: 6px 12px; border-radius: 5px;
        border: none; cursor: pointer; font-size: 13px;
    }
    .topo a:hover, .topo button:hover { background: rgba(255,255,255,0.35); }
    .barra-acoes { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .barra-acoes button {
        padding: 10px 20px; border: none; border-radius: 5px;
        font-size: 14px; font-weight: bold; cursor: pointer; color: white;
    }
    .btn-imprimir { background: #222; }
    .btn-imprimir:hover { background: #000; }
    
    .btn-visualizar { background: #3949ab; }
    .btn-visualizar:hover { background: #283593; }

    .btn-sair-visualizar { background: #c62828; }
    .btn-sair-visualizar:hover { background: #b71c1c; }

    /* ===== MODO VISUALIZAÇÃO (tela cheia) ===== */
    body.modo-visualizacao {
        background: #1a1a1a;
        margin: 0;
        padding: 15px;
    }

    body.modo-visualizacao .topo,
    body.modo-visualizacao .status,
    body.modo-visualizacao .btn-visualizar,
    body.modo-visualizacao .btn-imprimir {
        display: none !important;
    }

    body.modo-visualizacao .btn-sair-visualizar {
        display: inline-block !important;
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 9999;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        font-size: 14px;
        padding: 10px 18px;
    }

    body.modo-visualizacao .tabela-container {
        background: white;
        margin: 0 auto 20px auto;
        max-width: 1400px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        border-radius: 10px;
    }

    body.modo-visualizacao h2 {
        color: #000;
        font-size: 22px;
    }

    body.modo-visualizacao table {
        font-size: 14px;
    }

    body.modo-visualizacao th,
    body.modo-visualizacao td {
        padding: 10px 8px;
        height: 40px;
    }

    body.modo-visualizacao .nome-dia {
        font-size: 15px;
    }

    body.modo-visualizacao .data-dia {
        font-size: 13px;
    }
        /* Bloqueia edição no modo visualização */
    body.modo-visualizacao td[contenteditable="true"],
    body.modo-visualizacao .data-dia[contenteditable="true"] {
        cursor: default !important;
        pointer-events: none !important;
    }

    body.modo-visualizacao td[contenteditable="true"]:hover,
    body.modo-visualizacao .data-dia[contenteditable="true"]:hover {
        background: inherit !important;
    }

    body.modo-visualizacao td[contenteditable="true"]:focus,
    body.modo-visualizacao .data-dia[contenteditable="true"]:focus {
        outline: none !important;
        background: inherit !important;
    }
    .tabela-container {
        margin-bottom: 30px; background: white; padding: 20px;
        border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 { color: #000; margin-bottom: 15px; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #999; padding: 8px; text-align: center; height: 35px; }
    th { background: #4a4a4a; color: white; font-weight: bold; }
    td.coluna-aula { background: #e0e0e0; font-weight: bold; color: #000; width: 50px; }
    th.th-cabecalho-dia {
        background: #4a4a4a; color: white; padding: 6px 4px; vertical-align: middle;
    }
    .nome-dia { font-size: 13px; font-weight: bold; margin-bottom: 3px; }
    .data-dia {
        font-size: 11px; font-weight: normal; background: transparent;
        border-radius: 3px; padding: 2px 6px; display: inline-block;
        cursor: text; transition: background 0.15s;
    }
    .data-dia:hover { background: #808080; }
    .data-dia:focus { outline: 2px solid #ffb300; background: #505050; }
    td[contenteditable="true"] { cursor: text; background: #fff; font-weight: bold; }
    td[contenteditable="true"]:hover { background: #f0f0f0; }
    td[contenteditable="true"]:focus { outline: 2px solid #000; background: #f5f5f5; }
    td[contenteditable="true"]:empty::before {
        content: "clique para escrever"; color: #bbb; font-size: 11px; font-style: italic; font-weight: normal;
    }
    td.bloqueada {
        background-color: #e8e8e8 !important;
        cursor: not-allowed !important;
        color: #555;
    }
    td.admin-pode-editar { background-color: #fffbe6 !important; }
    td.admin-pode-editar:hover { background-color: #fff3c4 !important; }
    tr.linha-aula:nth-child(odd) td { background: #fafafa; }
    tr.linha-aula:nth-child(even) td { background: #f0f0f0; }
    tr.linha-aula:nth-child(odd) td.coluna-aula { background: #e0e0e0; }
    tr.linha-aula:nth-child(even) td.coluna-aula { background: #d5d5d5; }
    tr.linha-separadora td { height: 15px; border: none; background: transparent !important; }
    .status {
        text-align: center; margin-bottom: 15px; padding: 8px;
        border-radius: 5px; font-weight: bold;
    }
    .status.online { background: #d4edda; color: #155724; }
    .status.offline { background: #f8d7da; color: #721c24; }
    .status.admin { background: #fff3cd; color: #856404; }

    @media print {
        @page { size: A4 landscape; margin: 6mm; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { margin: 0; padding: 0; background: white; font-size: 14px; }
        .barra-acoes, .status, .topo { display: none; }
        .tabela-container {
            page-break-after: always;
            break-after: page;
            page-break-inside: avoid;
            break-inside: avoid;
            box-shadow: none;
            border-radius: 0;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 198mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .tabela-container:last-child {
            page-break-after: auto;
            break-after: auto;
        }
        h2 { font-size: 20px; margin: 0 0 6px 0; text-align: center; color: #000; line-height: 1; }
        table {
            width: 100%;
            margin: 0;
            font-size: 14px;
            border-collapse: collapse;
            table-layout: fixed;
            flex: 1;
            height: 100%;
        }
        th, td {
            border: 1px solid #000;
            padding: 2px 5px;
            text-align: center;
            vertical-align: middle;
            line-height: 1.15;
            overflow: hidden;
        }
        tr.linha-aula td:not(.coluna-aula) {
            font-weight: bold;
        }
        tr:not(.linha-aula):not(.linha-separadora) th {
            background: #4a4a4a !important;
            color: white !important;
            font-size: 13px;
            padding: 2px 4px;
            height: 22px;
        }
        tr:not(.linha-aula):not(.linha-separadora) th:first-child {
            width: 40px;
            font-size: 13px;
        }
        th.th-cabecalho-dia { vertical-align: middle; }
        .nome-dia { font-size: 13px; margin-bottom: 1px; font-weight: bold; line-height: 1.05; }
        .data-dia { font-size: 12px; background: transparent !important; padding: 0; line-height: 1; font-weight: normal; }
        tr.linha-aula td {
            height: 29px;
        }
        td.coluna-aula {
            color: #000 !important;
            font-size: 14px;
            font-weight: bold;
            width: 45px;
        }
        tr.linha-aula:nth-child(odd) td { background: #fafafa !important; }
        tr.linha-aula:nth-child(even) td { background: #ececec !important; }
        tr.linha-aula:nth-child(odd) td.coluna-aula { background: #e0e0e0 !important; }
        tr.linha-aula:nth-child(even) td.coluna-aula { background: #d5d5d5 !important; }
        tr.linha-separadora td {
            height: 6px;
            border: none;
            background: transparent !important;
            padding: 0;
            line-height: 0;
        }
        td[contenteditable="true"]:empty::before { content: ""; }
        td[contenteditable="true"]:focus { outline: none; }
        td.bloqueada, td.admin-pode-editar { background-color: inherit !important; }
    }
</style>
</head>
<body>

<div class="topo">
    <h1>🌙 Turno Tarde</h1>
    <div class="acoes">
        <button id="btnLogin" onclick="loginGoogle()" style="display:none">👑 Entrar como Admin</button>
        <button id="btnLogout" onclick="logoutAdmin()" style="display:none">🚪 Sair do admin</button>
        <a href="index.html">← Voltar</a>
    </div>
</div>

<div class="status" id="status">⏳ Conectando...</div>

<div class="barra-acoes">
    <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
    <button class="btn-visualizar" onclick="entrarVisualizacao()">🔍 Visualização</button>
    <button class="btn-sair-visualizar" onclick="sairVisualizacao()" style="display:none">✕ Sair</button>
</div>

<div id="tabelas"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut }
    from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2TkDJCfh4tp55bnxV3SUwClihYVmAd3U",
  authDomain: "tabelas-salas-4f49c.firebaseapp.com",
  projectId: "tabelas-salas-4f49c",
  storageBucket: "tabelas-salas-4f49c.firebasestorage.app",
  messagingSenderId: "264753669194",
  appId: "1:264753669194:web:51cc2a78e852647cf632b3"
};

const EMAIL_ADMIN = "informaticadonabranca@gmail.com";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const TURNO = 'tarde';
const SALAS = [
    { id: 'sala-informatica', nome: 'Sala de Informática - Tarde' },
    { id: 'multiuso',         nome: 'Multiuso - Tarde' },
    { id: 'itinerante',       nome: 'Itinerante - Tarde' }
];
const DIAS = ['Segunda-Feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira'];
const DATAS = ['28/09', '29/09', '30/09', '01/10', '02/10'];
const BLOCOS = 4;
const AULAS = [1, 2, 3, 4, 5];

let usuarioAtual = null;
let isAdmin = false;

function atualizarStatus(texto, tipo) {
    const el = document.getElementById('status');
    el.textContent = texto;
    el.className = 'status ' + tipo;
}

function gerarTabelas() {
    const container = document.getElementById('tabelas');
    container.innerHTML = '';

    SALAS.forEach(sala => {
        const div = document.createElement('div');
        div.className = 'tabela-container';

        const h2 = document.createElement('h2');
        h2.textContent = sala.nome;
        div.appendChild(h2);

        const table = document.createElement('table');
        table.className = sala.id;
        const tbody = document.createElement('tbody');

        for (let b = 0; b < BLOCOS; b++) {
            const trCab = document.createElement('tr');
            let htmlCab = `<th>Aula</th>`;
            DIAS.forEach((dia, i) => {
                const dataId = `${TURNO}_${sala.id}_bloco${b}_data_dia${i}`;
                htmlCab += `
                    <th class="th-cabecalho-dia">
                        <div class="nome-dia">${dia}</div>
                        <div class="data-dia" contenteditable="true" data-id="${dataId}" data-tipo="data">📅 ${DATAS[i]}</div>
                    </th>`;
            });
            trCab.innerHTML = htmlCab;
            tbody.appendChild(trCab);

            AULAS.forEach(n => {
                const tr = document.createElement('tr');
                tr.className = 'linha-aula';
                let html = `<td class="coluna-aula">${n}</td>`;
                DIAS.forEach((dia, i) => {
                    const celulaId = `${TURNO}_${sala.id}_bloco${b}_aula${n}_dia${i}`;
                    html += `<td contenteditable="true" data-id="${celulaId}" data-sala="${sala.id}"></td>`;
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            if (b < BLOCOS - 1) {
                const trSep = document.createElement('tr');
                trSep.className = 'linha-separadora';
                trSep.innerHTML = `<td colspan="6"></td>`;
                tbody.appendChild(trSep);
            }
        }

        table.appendChild(tbody);
        div.appendChild(table);
        container.appendChild(div);
    });
}

function aplicarDados(dados) {
    document.querySelectorAll('td[data-id], .data-dia[data-id]').forEach(celula => {
        const id = celula.dataset.id;
        const dado = dados[id];
        const ehData = celula.dataset.tipo === 'data';

        celula.classList.remove('bloqueada', 'admin-pode-editar');

        if (dado && dado.conteudo) {
            celula.textContent = dado.conteudo;
            const ehDono = dado.dono && dado.dono === usuarioAtual;

            if (isAdmin) {
                celula.contentEditable = 'true';
                if (!ehData) celula.classList.add('admin-pode-editar');
                celula.title = '👑 Você (admin) pode editar';
            } else if (ehDono) {
                celula.contentEditable = 'true';
                celula.title = 'Você criou — pode editar';
            } else {
                celula.contentEditable = 'false';
                if (!ehData) celula.classList.add('bloqueada');
                celula.title = 'Preenchido por outra pessoa';
            }
        } else {
            if (ehData) {
                const match = id.match(/data_dia(\d+)$/);
                if (match) {
                    const idx = parseInt(match[1]);
                    celula.textContent = '📅 ' + (DATAS[idx] || '');
                }
            } else {
                celula.textContent = '';
            }
            celula.contentEditable = 'true';
            celula.title = '';
        }
    });
}

async function salvarCelula(celula) {
    const id = celula.dataset.id;
    const conteudo = celula.textContent.trim();
    const dono = usuarioAtual;
    const conteudoOriginal = celula.dataset.valorOriginal || '';

    if (!dono) return;

    try {
        const docRef = doc(db, "celulas", id);

        if (conteudo === '') {
            await deleteDoc(docRef);
        } else {
            try {
                await updateDoc(docRef, { conteudo });
            } catch (e) {
                await setDoc(docRef, { conteudo, dono });
            }
        }
    } catch (erro) {
        console.error("Erro ao salvar (sem permissão):", erro);
        celula.textContent = conteudoOriginal;
    }
}

function configurarEdicao() {
    document.querySelectorAll('td[data-id], .data-dia[data-id]').forEach(celula => {
        celula.addEventListener('focus', () => {
            celula.dataset.valorOriginal = celula.textContent;
        });

        celula.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); celula.blur(); }
        });

        celula.addEventListener('blur', () => { salvarCelula(celula); });
    });
}

function ouvirMudancas() {
    onSnapshot(collection(db, "celulas"), (snapshot) => {
        const dados = {};
        snapshot.forEach(doc => { dados[doc.id] = doc.data(); });
        aplicarDados(dados);
    });
}

window.loginGoogle = async function() {
    const provider = new GoogleAuthProvider();
    try {
        await signInWithPopup(auth, provider);
    } catch (e) {
        alert("Erro ao fazer login: " + e.message);
    }
};

window.logoutAdmin = async function() {
    try {
        await signOut(auth);
        await signInAnonymously(auth);
    } catch (e) {
        alert("Erro ao sair: " + e.message);
    }
};
// ===== MODO VISUALIZAÇÃO =====
window.entrarVisualizacao = function() {
    document.body.classList.add('modo-visualizacao');

    // Guarda quais elementos estavam editáveis para restaurar depois
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
        el.dataset.editavelOriginal = 'true';
        el.contentEditable = 'false';
    });

    // Tenta entrar em tela cheia (fullscreen)
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {
            console.warn('Não foi possível entrar em tela cheia:', err);
        });
    }
};

window.sairVisualizacao = function() {
    document.body.classList.remove('modo-visualizacao');

    // Restaura a editabilidade dos elementos
    document.querySelectorAll('[data-editavel-original="true"]').forEach(el => {
        el.contentEditable = 'true';
        delete el.dataset.editavelOriginal;
    });

    // Sai da tela cheia se estiver
    if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => {
            console.warn('Erro ao sair da tela cheia:', err);
        });
    }
};

// Sai do modo visualização se apertar ESC
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('modo-visualizacao')) {
        sairVisualizacao();
    }
});

// Se o usuário sair da tela cheia manualmente, sai do modo visualização também
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('modo-visualizacao')) {
        document.body.classList.remove('modo-visualizacao');
    }
});

async function iniciar() {
    atualizarStatus("🔐 Autenticando...", "offline");

    try { await signInAnonymously(auth); }
    catch (erro) { atualizarStatus("❌ Erro na autenticação", "offline"); return; }

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            usuarioAtual = null;
            atualizarStatus("❌ Não autenticado", "offline");
            return;
        }

        usuarioAtual = user.uid;
        isAdmin = (user.email === EMAIL_ADMIN);

        document.getElementById('btnLogin').style.display = isAdmin ? 'none' : 'inline-block';
        document.getElementById('btnLogout').style.display = isAdmin ? 'inline-block' : 'none';

        if (isAdmin) {
            atualizarStatus("👑 ADMIN — você pode editar qualquer célula", "admin");
        } else {
            atualizarStatus("✅ Conectado — você pode adicionar em células vazias e editar as que criou", "online");
        }

        const container = document.getElementById('tabelas');
        if (container.children.length === 0) {
            gerarTabelas();
            configurarEdicao();
        }

        const snapshot = await getDocs(collection(db, "celulas"));
        const dados = {};
        snapshot.forEach(doc => { dados[doc.id] = doc.data(); });
        aplicarDados(dados);

        ouvirMudancas();
    });
}

iniciar();
</script>

</body>
</html>
