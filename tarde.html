<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turno Tarde</title>
<link rel="icon" href="logofavicon.png" type="image/png">
<link rel="apple-touch-icon" href="logofavicon.png">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-turno="tarde">

<div class="topo" id="topo">
    <h1>🌙 Turno Tarde</h1>
    <div class="acoes">
        <button id="btnLogin" onclick="loginGoogle()" style="display:none">👑 Entrar como Admin</button>
        <button id="btnLogout" onclick="logoutAdmin()" style="display:none">🚪 Sair</button>
        <a href="index.html">← Voltar</a>
    </div>
</div>

<div class="status" id="status">⏳ Conectando...</div>

<div class="barra-acoes">
    <button class="btn-visualizar" onclick="entrarVisualizacao()" style="display:none">🔍 Visualização</button>
    <button class="btn-sair-visualizar" onclick="sairVisualizacao()" style="display:none">✕ Sair</button>
    <button class="btn-admin" onclick="abrirPainelAdmin()" style="display:none">⚙️ Gerenciar Acessos</button>
</div>

<!-- Painel Admin (escondido por padrão) -->
<div id="painel-admin" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000; padding:40px; box-sizing:border-box; overflow-y:auto;">
    <div style="background:white; max-width:600px; margin:0 auto; padding:30px; border-radius:10px; max-height:85vh; overflow-y:auto;">
        <h2 style="margin-top:0;">⚙️ Gerenciar Acessos</h2>
        <p>Adicione ou remova e-mails autorizados:</p>

        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="email" id="novo-email" placeholder="email@gmail.com" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:5px; font-size:14px;">
            <button onclick="adicionarEmail()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">➕ Adicionar</button>
        </div>

        <div id="lista-emails" style="border:1px solid #eee; border-radius:5px; padding:10px;">
            Carregando...
        </div>

        <button onclick="fecharPainelAdmin()" style="margin-top:20px; padding:10px 20px; background:#666; color:white; border:none; border-radius:5px; cursor:pointer; width:100%; font-weight:bold;">Fechar</button>
    </div>
</div>

<div id="tabelas"></div>

<script type="module" src="js/app.js"></script>

</body>
</html>
